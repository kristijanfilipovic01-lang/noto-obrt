<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="css/kontakt.css">
</head>
<body>

<section id="kontakt">
    <h1>Kontakt</h1>
    <p>Pošaljite upit i javit ćemo vam se u najkraćem roku.</p>

    <form action="send.php" method="POST" class="kontakt-form">

        <div class="form-group">
            <label for="ime">Ime</label>
            <input type="text" id="ime" name="ime" required>
        </div>

        <div class="form-group">
            <label for="prezime">Prezime</label>
            <input type="text" id="prezime" name="prezime" required>
        </div>

        <div class="form-group">
            <label for="broj">Broj mobitela</label>
            <input type="tel" id="broj" name="broj" required>
        </div>

        <div class="form-group">
            <label for="email">E‑mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="adresa">Adresa</label>
            <input type="text" id="adresa" name="adresa">
        </div>

        <div class="form-group">
            <label for="poruka">Poruka</label>
            <textarea id="poruka" name="poruka" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn">Pošalji</button>

    </form>
</section>

</body>
</html>
